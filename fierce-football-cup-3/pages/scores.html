<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a href="../index.html" class="nav-logo">
      <span class="logo-icon"><i class="fas fa-futbol"></i></span>
      <div><div class="logo-title">EKSU FRESHER'S CUP</div><div class="logo-sub">3.0 · FIERCE TOURNAMENT</div></div>
    </a>
    <div class="nav-links">
      <a href="scores.html" style="color:#4ade80">Scores</a>
      <a href="fixtures.html">Fixtures</a>
      <a href="standings.html">Standings</a>
      <a href="bracket.html">Bracket</a>
      <a href="stats.html">Stats</a>

    </div>

  </div>
  <div class="mobile-menu" id="mobileMenu">
    <a href="../index.html">Home</a>
    <a href="scores.html">Scores</a><a href="fixtures.html">Fixtures</a>
    <a href="standings.html">Standings</a><a href="bracket.html">Bracket</a>
    <a href="stats.html">Stats</a><a href="stream.html">Live Stream</a>
  </div>
</nav>

<div class="page-header">
  <div class="page-header-inner">
    <div class="page-title">SCORES</div>
    <div class="page-sub">All match results · EKSU Fresher's Cup 3.0</div>
  </div>
</div>

<div class="container" style="padding-bottom:4rem;">
  <div class="tab-nav">
    <button class="tab-btn active" onclick="showTab('live')">Live & Today</button>
    <button class="tab-btn" onclick="showTab('results')">Results</button>
  </div>

  <div class="tab-panel active" id="tab-live">
    <div id="liveMatches"></div>
  </div>
  <div class="tab-panel" id="tab-results">
    <div id="resultMatches"></div>
  </div>
</div>

<footer class="footer">
  <div class="container">
    <div class="footer-logo">EKSU FRESHER'S CUP 3.0</div>
    <div class="footer-links">
      <a href="../index.html">Home</a><a href="fixtures.html">Fixtures</a><a href="standings.html">Standings</a>
    </div>
    <div class="footer-copy">Built by Kenny (Malik) · CPE Technical Team</div>
  </div>
</footer>

<script src="../js/data.js"></script>
<script>
function toggleMenu(){document.getElementById('mobileMenu').classList.toggle('open');}
function showTab(id){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  event.currentTarget.classList.add('active');
}

function renderMatch(m, container) {
  const home = getTeam(m.home), away = getTeam(m.away);
  const isLive = m.status === 'live';
  const isFt = m.status === 'ft';
  const div = document.createElement('div');
  div.className = 'match-card' + (isLive ? ' live-match' : '');
  div.style.marginBottom = '12px';
  div.innerHTML = `
    <div class="match-top">
      <span class="match-round">${m.round}</span>
      <span class="match-time-badge ${isLive?'live':isFt?'ft':'upcoming'}">
        ${isLive?`<span class="live-dot"></span>${m.minute}'`:isFt?'FT':m.time}
      </span>
    </div>
    <div class="match-body">
      <div class="team-side"><div class="team-name">${home.name}</div><div class="team-dept">${home.dept}</div></div>
      <div class="score-display">${isFt||isLive?`${m.homeScore} <span class="score-sep">:</span> ${m.awayScore}`:'<span style="font-size:16px;color:rgba(255,255,255,0.3)">vs</span>'}</div>
      <div class="team-side right"><div class="team-name">${away.name}</div><div class="team-dept">${away.dept}</div></div>
    </div>
    <div style="margin-top:8px;font-size:11px;color:rgba(255,255,255,0.3);text-align:center;">
      <i class="fas fa-map-marker-alt"></i> ${m.venue} &nbsp;·&nbsp; ${m.date}
    </div>`;
  container.appendChild(div);
}

const liveContainer = document.getElementById('liveMatches');
const resultContainer = document.getElementById('resultMatches');

const liveMatches = DATA.matches.filter(m => m.status === 'live');
const ftMatches = DATA.matches.filter(m => m.status === 'ft');

if (liveMatches.length === 0 && ftMatches.length === 0) {
  liveContainer.innerHTML = '<p style="color:rgba(255,255,255,0.35);font-size:14px;padding:2rem 0;">No matches today yet.</p>';
} else {
  if (liveMatches.length > 0) {
    const h = document.createElement('div');
    h.style.cssText = 'font-size:11px;color:#f87171;text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px;';
    h.innerHTML = '<span class="live-dot"></span> Live now';
    liveContainer.appendChild(h);
    liveMatches.forEach(m => renderMatch(m, liveContainer));
  }
  if (ftMatches.length > 0) {
    const h = document.createElement('div');
    h.style.cssText = 'font-size:11px;color:rgba(255,255,255,0.35);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin:1.5rem 0 10px;';
    h.textContent = 'Earlier';
    liveContainer.appendChild(h);
    ftMatches.forEach(m => renderMatch(m, liveContainer));
  }
}

ftMatches.forEach(m => renderMatch(m, resultContainer));
if (ftMatches.length === 0) {
  resultContainer.innerHTML = '<p style="color:rgba(255,255,255,0.35);font-size:14px;padding:2rem 0;">No results yet.</p>';
}
</script>
</body>
</html>
