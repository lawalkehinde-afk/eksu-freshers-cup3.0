<script src="../js/data.js"></script>
<script>
function toggleMenu(){document.getElementById('mobileMenu').classList.toggle('open');}

const root = document.getElementById('fixturesRoot');

// Group matches by date
const byDate = {};
DATA.matches.forEach(m => {
  if (!byDate[m.date]) byDate[m.date] = [];
  byDate[m.date].push(m);
});

const sortedDates = Object.keys(byDate).sort();

sortedDates.forEach(date => {
  const label = document.createElement('div');
  label.style.cssText = 'font-size:11px;font-weight:600;color:rgba(255,255,255,0.35);text-transform:uppercase;letter-spacing:1.5px;margin:1.5rem 0 0.75rem;';
  const d = new Date(date);
  label.textContent = d.toLocaleDateString('en-NG', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  root.appendChild(label);

  byDate[date].forEach(m => {
    const home = getTeam(m.home), away = getTeam(m.away);
    const isLive = m.status === 'live', isFt = m.status === 'ft';
    const card = document.createElement('div');
    card.className = 'match-card' + (isLive?' live-match':'');
    card.style.marginBottom = '10px';
    card.innerHTML = `
      <div class="match-top">
        <span class="match-round">${m.round}</span>
        <span class="match-time-badge ${isLive?'live':isFt?'ft':'upcoming'}">
          ${isLive?`<span class="live-dot"></span>${m.minute}'`:isFt?'FT':m.time}
        </span>
      </div>
      <div class="match-body">
        <div class="team-side"><div class="team-name">${home.name}</div><div class="team-dept">${home.dept}</div></div>
        <div class="score-display">${isLive||isFt?`${m.homeScore} <span class="score-sep">:</span> ${m.awayScore}`:'<span style="font-size:16px;color:rgba(255,255,255,0.3)">vs</span>'}</div>
        <div class="team-side right"><div class="team-name">${away.name}</div><div class="team-dept">${away.dept}</div></div>
      </div>
      <div style="margin-top:8px;font-size:11px;color:rgba(255,255,255,0.3);text-align:center;">
        <i class="fas fa-map-marker-alt"></i> ${m.venue}
      </div>`;
    root.appendChild(card);
  });
});
</script>
</body>
</html>
