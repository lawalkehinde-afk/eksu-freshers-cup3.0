  <div class="page-header-inner">
    <div class="page-title">STANDINGS</div>
    <div class="page-sub">Group stage table · EKSU Fresher's Cup 3.0</div>
  </div>
</div>

<div class="container" style="padding-bottom:4rem;" id="standingsRoot"></div>

<footer class="footer">
  <div class="container">
    <div class="footer-logo">EKSU FRESHER'S CUP 3.0</div>
    <div class="footer-links"><a href="../index.html">Home</a><a href="scores.html">Scores</a><a href="bracket.html">Bracket</a></div>
    <div class="footer-copy">Built by Kenny (Malik) · CPE Technical Team</div>
  </div>

<!-- TICKER -->
<div class="ticker-wrap" id="tickerWrap"><div class="ticker-label"><i class="fas fa-futbol"></i> &nbsp;Live</div><div style="overflow:hidden;flex:1;"><div class="ticker-track" id="tickerTrack"></div></div></div>
<!-- GOAL POPUP -->
<div class="goal-overlay" id="goalOverlay" onclick="closeGoalPopup()"></div>
<div class="goal-popup" id="goalPopup"><button class="goal-popup-close" onclick="closeGoalPopup()"><i class="fas fa-times"></i></button><div class="goal-popup-icon">⚽</div><div class="goal-popup-title">GOAL!</div><div class="goal-popup-scorer" id="gpScorer"></div><div class="goal-popup-match" id="gpMatch"></div><div class="goal-popup-score" id="gpScore"></div></div>
<button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">☀️</button>
<script src="../js/data.js"></script>
<script>
function toggleMenu(){document.getElementById('mobileMenu').classList.toggle('open');}

const groups = ['A','B','C','D'];
const root = document.getElementById('standingsRoot');

const posCls = ['pos-1','pos-2','pos-3'];

groups.forEach(g => {
  const table = getStandings(g);
  if (table.every(t => t.name === 'TBD')) return;

  const section = document.createElement('div');
  section.innerHTML = `<div class="group-label">Group ${g}</div>`;

  const wrap = document.createElement('div');
  wrap.className = 'standings-wrap';
  wrap.style.marginBottom = '2rem';

  const t = document.createElement('table');
  t.className = 'standings-table';
  t.innerHTML = `<thead><tr>
    <th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th><th>Form</th>
  </tr></thead>`;

  const tbody = document.createElement('tbody');
  table.forEach((team, i) => {
    const formHTML = team.form.slice(-5).map(f =>
      `<span class="form-badge f${f.toLowerCase()}">${f}</span>`).join('');
    const posClass = posCls[i] || 'pos-n';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span class="pos-badge ${posClass}">${i+1}</span></td>
      <td><strong>${team.name}</strong><br><span style="font-size:11px;color:rgba(255,255,255,0.35)">${team.dept}</span></td>
      <td>${team.p}</td><td>${team.w}</td><td>${team.d}</td><td>${team.l}</td>
      <td>${team.gf}</td><td>${team.ga}</td>
      <td style="color:${team.gd>0?'#4ade80':team.gd<0?'#f87171':'inherit'}">${team.gd>0?'+':''}${team.gd}</td>
      <td><strong>${team.pts}</strong></td>
      <td>${formHTML}</td>`;
    tbody.appendChild(tr);
  });

  t.appendChild(tbody);
  wrap.appendChild(t);
  section.appendChild(wrap);
  root.appendChild(section);
});

const note = document.createElement('p');
note.style.cssText = 'font-size:12px;color:rgba(255,255,255,0.3);margin-top:1rem;';
note.innerHTML = '<i class="fas fa-info-circle"></i> Top 2 teams from each group advance to the knockout bracket.';
root.appendChild(note);
</script>
</body>
</html>
